<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.main{
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 80%;
    margin: 0 auto;
    padding: 20px 0;
}

.middle ul,
.left ul,
.logo ul{
    display: flex;
    list-style: none;
    gap: 20px;
}

a{
    text-decoration: none;
    color: black;
    font-size: 18px;
}

.logo a{
    font-weight: bold;
    font-size: 24px;
}
</style>

</head>
<body>


    
<nav>
    <div class="main">

        <div class="logo">
            <ul>
                <li><a href="#">Logo Text</a></li>
            </ul>
        </div>

        <div class="middle">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>

        <div class="left">
            <ul>
                <li><a href="#">Login</a></li>
            </ul>
        </div>

    </div>
</nav>

<div id="users">

</div>
<script src="./LoadData.js"></script>
</body>
</html>
